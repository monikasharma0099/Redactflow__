name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # -------------------------------------------------------------------------
  # Backend: pytest must pass WITHOUT network, GPU, or a running Ollama
  # server (heavy deps are mocked — contract: SPEC 1.9).
  # -------------------------------------------------------------------------
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Install spaCy model (en_core_web_sm, pinned wheel)
        run: |
          pip install https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1-py3-none-any.whl

      - name: Run tests with coverage (fail under 50%)
        working-directory: backend
        run: |
          python -m pytest tests/ -q --cov=app --cov-report=term-missing --cov-fail-under=50

  # -------------------------------------------------------------------------
  # Frontend: reproducible install, lint, and strict TS production build.
  # -------------------------------------------------------------------------
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (npm ci)
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build (tsc strict + vite)
        working-directory: frontend
        run: npm run build

  # -------------------------------------------------------------------------
  # Docker: the all-in-one image must build from a clean checkout.
  # -------------------------------------------------------------------------
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build root Dockerfile
        run: docker build .
